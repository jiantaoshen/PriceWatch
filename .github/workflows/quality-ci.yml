name: Backend Quality CI

on:
  pull_request:
    paths:
      - "src/PriceWatch.Core/**"
      - "src/PriceWatch.Data/**"
      - "src/PriceWatch.Private/**"
      - "src/PriceWatch.WebApi/**"
      - "tests/**"
      - "scraper/**"
      - "PriceWatch.slnx"
      - "global.json"
      - ".github/workflows/quality-ci.yml"

  push:
    branches:
      - main
    paths:
      - "src/PriceWatch.Core/**"
      - "src/PriceWatch.Data/**"
      - "src/PriceWatch.Private/**"
      - "src/PriceWatch.WebApi/**"
      - "tests/**"
      - "scraper/**"
      - "PriceWatch.slnx"
      - "global.json"
      - ".github/workflows/quality-ci.yml"

  workflow_dispatch:

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PriceWatch.slnx

      - name: Build
        run: dotnet build PriceWatch.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PriceWatch.slnx -c Release --no-build

  python:
    name: Python scraper tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scraper/requirements.txt

      - name: Test
        working-directory: scraper
        run: python -m pytest tests -q
