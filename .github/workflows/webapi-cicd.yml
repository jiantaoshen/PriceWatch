name: WebApi CI/CD

on:
  pull_request:
    paths:
      - "src/PriceWatch.WebApi/**"
      - "src/PriceWatch.Core/**"
      - "src/PriceWatch.Data/**"
      - "Dockerfile.webapi"
      - ".github/workflows/webapi-cicd.yml"

  push:
    branches:
      - main
    paths:
      - "src/PriceWatch.WebApi/**"
      - "src/PriceWatch.Core/**"
      - "src/PriceWatch.Data/**"
      - "Dockerfile.webapi"
      - ".github/workflows/webapi-cicd.yml"

  workflow_dispatch:

env:
  IMAGE: ghcr.io/jiantaoshen/pricewatch-webapi
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PriceWatch.sln

      - name: Build
        run: dotnet build PriceWatch.sln -c Release --no-restore

      - name: Test
        run: dotnet test PriceWatch.sln -c Release --no-build

      - name: Verify Docker build
        run: docker build -f Dockerfile.webapi -t pricewatch-webapi:ci .

  deploy:
    name: Push and deploy
    runs-on: ubuntu-latest
    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.webapi
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --quiet