name: WebApi CI/CD

on:
  pull_request:
    paths:
      - "src/PriceWatch.WebApi/**"
      - "src/PriceWatch.Core/**"
      - "src/PriceWatch.Data/**"
      - "Dockerfile.webapi"
      - ".github/workflows/webapi-cicd.yml"

  push:
    branches:
      - main
    paths:
      - "src/PriceWatch.WebApi/**"
      - "src/PriceWatch.Core/**"
      - "src/PriceWatch.Data/**"
      - "Dockerfile.webapi"
      - ".github/workflows/webapi-cicd.yml"

  workflow_dispatch:
    inputs:
      deploy_after_migration:
        description: "Deploy current main after the database migration has been applied"
        required: false
        default: false
        type: boolean

concurrency:
  group: webapi-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jiantaoshen/pricewatch-webapi
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PriceWatch.slnx

      - name: Build
        run: dotnet build PriceWatch.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PriceWatch.slnx -c Release --no-build

      - name: Verify Docker build
        run: docker build -f Dockerfile.webapi -t pricewatch-webapi:ci .

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: ci

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    outputs:
      migration_changed: ${{ steps.migration_changes.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect database migration changes
        id: migration_changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"

          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse "${GITHUB_SHA}^")"
          fi

          if git diff --quiet \
            "$before" \
            "$GITHUB_SHA" \
            -- src/PriceWatch.Data/Migrations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.webapi
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Explain migration deployment guard
        if: >
          github.event_name == 'push' &&
          steps.migration_changes.outputs.changed == 'true'
        shell: bash
        run: |
          {
            echo "## Production deployment paused"
            echo ""
            echo "Database migration files changed in this main update."
            echo ""
            echo "The WebApi image was successfully built and published to GHCR,"
            echo "but Cloud Run was intentionally not updated."
            echo ""
            echo "### Next steps"
            echo ""
            echo "1. Review and apply the database migration."
            echo "2. Open the WebApi CI/CD workflow."
            echo "3. Select the main branch."
            echo "4. Choose **Run workflow**."
            echo "5. Enable **deploy_after_migration**."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    needs:
      - ci
      - publish

    if: >
      github.ref == 'refs/heads/main' &&
      (
        (
          github.event_name == 'push' &&
          needs.publish.outputs.migration_changed != 'true'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy_after_migration == true
        )
      )

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        shell: bash
        run: |
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --quiet